# Termux CI: builds the Goose compiler with the same toolchain Termux uses
# (clang, cmake, make, python, git) and runs the test suite against it.
# GitHub Actions has no native Termux runners, so this runs on Ubuntu with
# Termux-equivalent packages.
#
# On a real Termux device the equivalent install is:
#   pkg install cmake clang git python make ninja
#   cmake -B build -DCMAKE_BUILD_TYPE=Debug -DGOOSE_BUILTIN_LIBS=all
#   cmake --build build --config Debug

name: CI (Termux)

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  termux:
    name: Termux-equivalent (clang + cmake on Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Termux-equivalent build dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          clang cmake make git python3 ninja-build

      - name: Configure
        run: cmake -B build-termux -DCMAKE_BUILD_TYPE=Debug -DGOOSE_BUILTIN_LIBS=all

      - name: Build
        run: cmake --build build-termux --config Debug

      - name: Check formatting
        run: build-termux/goose format --check samples stdlib

      - name: Test
        run: python test/run_tests.py --exe build-termux/goose --profile baseline --cc native --require-clang

      - name: Smoke test the compiler
        run: build-termux/goose --version
