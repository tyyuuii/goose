# Automatically sync upstream aardappel/goose main into this fork's main.
#
# Runs every 6 hours and on manual dispatch. Every successful sync pushes to
# main, which then triggers the nightly build (nightly.yml).

name: Sync upstream

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    name: Sync upstream/main → origin/main
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout this fork's main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ github.token }}
          fetch-depth: 0

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote and fetch
        run: |
          git remote add upstream https://github.com/aardappel/goose.git 2>/dev/null || true
          git fetch upstream

      - name: Merge upstream/main into main
        id: merge
        run: |
          git checkout main
          # Fast-forward if possible; otherwise take upstream's version for
          # conflicting files (theirs), keep our workflow files otherwise.
          if git merge --ff-only upstream/main; then
            echo "Fast-forwarded to upstream/main"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Fast-forward failed, merging with 'theirs' conflict resolution"
            git merge -X theirs upstream/main -m "Sync upstream/main" || true
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push synced main to fork
        if: steps.merge.outputs.changed == 'true'
        run: |
          git push origin main

      - name: Trigger nightly build
        if: steps.merge.outputs.changed == 'true'
        run: |
          gh workflow run nightly.yml --ref main --repo tyyuuii/goose
        env:
          GH_TOKEN: ${{ github.token }}
