# Nightly Goose built natively in Termux aarch64 (latest Termux) inside Docker.
#
# Triggers:
#   - on every push/merge to main or master
#   - on a schedule (every night at 02:00 UTC)
#   - manually (workflow_dispatch)
#
# Runs on a native GitHub-hosted aarch64 runner (ubuntu-24.04-arm) and executes
# the build inside the official termux/termux-docker:aarch64 container so the
# produced binary is a genuine Termux aarch64 binary, not an NDK cross-compile.
#
# Produces an immutable tag `nightly-<YYYYMMDD>-<shortsha>` and updates a single
# GitHub release called "Goose Nightly" so it always points to the latest build.
# The build archive is also uploaded as a workflow artifact you can download.

name: Nightly build for Termux (Android arm64)

on:
  push:
    branches: [main, master]
  schedule:
    - cron: '0 2 * * *'   # nightly at 02:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Goose natively in Termux aarch64 (Docker)
    runs-on: ubuntu-24.04-arm   # native aarch64 GitHub-hosted runner
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # Make the workspace writable by the non-root Termux user inside the
      # container, then mount it in so build outputs land back on the runner.
      - name: Prepare workspace for Termux container
        run: chmod -R a+rwX "$PWD"

      - name: Build Goose inside Termux aarch64 Docker
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD":/work \
            -w /work \
            -e TERMUX_MAIN_PACKAGE_FORMAT=debian \
            termux/termux-docker:aarch64 \
            bash -lc '
              set -euo pipefail
              # termux-docker may not source the profile that puts
              # $PREFIX/bin on PATH; set it explicitly.
              export PATH="/data/data/com.termux/files/usr/bin:$PATH"

              echo "::group::Termux sanity"
              uname -a
              uname -o
              command -v clang || true
              echo "::endgroup::"

              echo "::group::Install Termux build dependencies"
              apt-get update -y
              apt-get install -y --no-install-recommends \
                clang cmake make ninja git file
              echo "::endgroup::"

              echo "::group::Configure Goose (Release)"
              cmake -S . -B build \
                -DCMAKE_BUILD_TYPE=Release \
                -DGOOSE_VERSION="nightly-$(date -u +%Y%m%d)-${GITHUB_SHA::8}"
              echo "::endgroup::"

              echo "::group::Build Goose"
              cmake --build build --parallel "$(nproc)"
              echo "::endgroup::"

              echo "::group::Verify binary is aarch64 ELF"
              file build/goose
              readelf -h build/goose | grep -E "Class|Machine|Type"
              echo "::endgroup::"

              echo "::group::Package release directory"
              mkdir -p dist/goose-termux-arm64/bin
              cp build/goose dist/goose-termux-arm64/bin/goose
              cp -r stdlib dist/goose-termux-arm64/stdlib
              cp -r docs dist/goose-termux-arm64/docs
              cp -r samples dist/goose-termux-arm64/samples
              cp README.md LICENSE dist/goose-termux-arm64/
              rm -rf dist/goose-termux-arm64/samples/run_samples.py dist/goose-termux-arm64/samples/expected
              tar -czf goose-termux-arm64.tar.gz -C dist goose-termux-arm64
              ls -la goose-termux-arm64.tar.gz
              echo "::endgroup::"
            '

      - name: Upload nightly artifact
        uses: actions/upload-artifact@v4
        with:
          name: goose-termux-arm64-nightly
          path: goose-termux-arm64.tar.gz
          retention-days: 30

      - name: Tag and publish nightly release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DATE=$(date -u +%Y%m%d)
          TAG="nightly-${DATE}-${GITHUB_SHA::8}"

          # Create immutable nightly tag for traceability
          git tag "$TAG"
          git push origin "$TAG"

          # Write release notes
          printf 'Nightly build from commit %s on %s.\nBuilt natively in Termux aarch64 (latest Termux) inside Docker on GitHub Actions.\n\nInstall:\n  tar xzf goose-termux-arm64.tar.gz\n  cd goose-termux-arm64\n  export GOOSE_STDLIB=$PWD/stdlib\n  export PATH=$PWD/bin:$PATH\n  ./bin/goose --version\n' \
            "$GITHUB_SHA::8" "$(date -u)" > /tmp/nightly-notes.txt

          # Create or update the "nightly" release (always latest)
          if gh release view "nightly" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "nightly" "goose-termux-arm64.tar.gz" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "nightly" \
              --title "Goose Nightly (${DATE})" \
              --notes-file /tmp/nightly-notes.txt \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "nightly" \
              "goose-termux-arm64.tar.gz" \
              --title "Goose Nightly (${DATE})" \
              --notes-file /tmp/nightly-notes.txt \
              --repo "$GITHUB_REPOSITORY"
          fi
