# Nightly cross-compiled Goose for Android arm64 (Termux).
#
# Triggers:
#   - on a schedule (every night at 02:00 UTC)
#   - on every push to main (after sync-upstream merges latest upstream)
#
# Produces an immutable tag `nightly-<YYYYMMDD>-<shortsha>` and updates a
# single GitHub release called "Goose Nightly" so it always points to the
# latest build. Users can install from the "nightly" release asset.

name: Nightly build for Termux (Android arm64)

on:
  schedule:
    - cron: '0 2 * * *'   # nightly at 02:00 UTC
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Cross-compile Goose for Android arm64
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends \
            curl unzip zip wget file ninja-build qemu-user-static

      - name: Download Android NDK
        timeout-minutes: 40
        run: |
          curl -L --retry 3 --retry-delay 10 \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36" \
            -H "Referer: https://developer.android.com/" \
            -o android-ndk.zip \
            https://dl.google.com/android/repository/android-ndk-r30-linux.zip
          unzip -q android-ndk.zip
          echo "NDK_DIR=$PWD/android-ndk-r30" >> "$GITHUB_ENV"

      - name: Configure CMake for Android arm64
        run: |
          cmake -S . -B build-android \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK_DIR/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-21 \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release \
            -DGOOSE_VERSION="nightly-${GITHUB_SHA::8}"

      - name: Build Goose
        timeout-minutes: 30
        run: cmake --build build-android --parallel "$(nproc)"

      - name: Verify binary is aarch64
        run: |
          file build-android/goose
          readelf -h build-android/goose | grep -E 'Class|Machine|Type'

      - name: Generate man page (best effort)
        run: |
          mkdir -p dist/goose-termux-arm64/man
          if qemu-aarch64-static build-android/goose help --man > dist/goose-termux-arm64/man/goose.1 2>/dev/null; then
            echo "man page generated"
          else
            echo "man page skipped (arm64 binary cannot run on x86_64 runner)"
          fi

      - name: Package release directory
        run: |
          mkdir -p dist/goose-termux-arm64/bin
          cp build-android/goose dist/goose-termux-arm64/bin/goose
          cp -r build-android/tcclib dist/goose-termux-arm64/tcclib
          cp -r stdlib dist/goose-termux-arm64/stdlib
          cp -r docs dist/goose-termux-arm64/docs
          cp -r samples dist/goose-termux-arm64/samples
          cp README.md LICENSE dist/goose-termux-arm64/
          rm -rf dist/goose-termux-arm64/samples/run_samples.py dist/goose-termux-arm64/samples/expected

      - name: Archive
        working-directory: dist
        run: tar -czf goose-termux-arm64.tar.gz goose-termux-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: goose-termux-arm64-nightly
          path: dist/goose-termux-arm64.tar.gz
          retention-days: 3

      - name: Tag and publish nightly release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DATE=$(date -u +%Y%m%d)
          TAG="nightly-${DATE}-${GITHUB_SHA::8}"

          # Create immutable nightly tag for traceability
          git tag "$TAG"
          git push origin "$TAG"

          # Create or update the "nightly" release (always latest)
          if gh release view "nightly" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "nightly" "dist/goose-termux-arm64.tar.gz" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "nightly" \
              --title "Goose Nightly (${DATE})" \
              --notes "Nightly build from commit ${GITHUB_SHA::8} on $(date -u). Cross-compiled for Android arm64 (aarch64) with the NDK.

Install:
  pkg install wget
  wget https://github.com/${GITHUB_REPOSITORY}/releases/download/nightly/goose-termux-arm64.tar.gz
  tar xzf goose-termux-arm64.tar.gz
  cd goose-termux-arm64
  export GOOSE_STDLIB=\$PWD/stdlib
  export PATH=\$PWD/bin:\$PATH
  ./bin/goose --version" \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "nightly" \
              "dist/goose-termux-arm64.tar.gz" \
              --title "Goose Nightly (${DATE})" \
              --notes "Nightly build from commit ${GITHUB_SHA::8} on $(date -u). Cross-compiled for Android arm64 (aarch64) with the NDK.

Install:
  pkg install wget
  wget https://github.com/${GITHUB_REPOSITORY}/releases/download/nightly/goose-termux-arm64.tar.gz
  tar xzf goose-termux-arm64.tar.gz
  cd goose-termux-arm64
  export GOOSE_STDLIB=\$PWD/stdlib
  export PATH=\$PWD/bin:\$PATH
  ./bin/goose --version" \
              --repo "$GITHUB_REPOSITORY"
